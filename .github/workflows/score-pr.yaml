name: Score PR - Java

# ⚠️  SECURITY WARNING: This workflow uses pull_request_target
# This runs with access to LEADERBOARD_TOKEN secret in the original repo's context.
# This is safe ONLY because:
# 1. We do NOT install fork dependencies (npm install, pip install, etc.)
# 2. We do NOT execute fork code (scripts, setup.py, build files)
# 3. We only run static analysis tools on manifests (npm audit, pip-audit, dependency-check)
# 4. We only read fork files, never execute them
#
# DO NOT change this workflow to:
# - Run npm install / pip install / mvn build from the fork
# - Execute scripts from the fork
# - Run arbitrary commands with fork inputs
# This would allow malicious PRs to steal LEADERBOARD_TOKEN.

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

on:
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - main
      - participant-start

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original repo
        uses: actions/checkout@v4
        with:
          path: original

      - name: Parse baseline from SCAN-RESULTS.md
        id: baseline
        run: |
          cd original
          baseline=$(python3 scripts/parse-baseline.py SCAN-RESULTS.md)
          echo "count=$baseline" >> $GITHUB_OUTPUT
          echo "📊 Baseline: $baseline vulnerabilities"

      - name: Checkout PR fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: fork

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Resolve Maven dependencies
        run: |
          mvn -f fork/app/pom.xml dependency:resolve -DskipTests -q -DdisableTransferProgress=true || true

      - name: Download cached NVD Database from Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.dependency-check/data
          DATE=$(date -u +'%Y-%m-%d')
          TAG="nvd-cache-${DATE}"

          # Try to download today's cache, fallback to any recent cache
          gh release download "$TAG" --pattern "nvd-database.tar.gz" -O /tmp/nvd.tar.gz 2>/dev/null || \
          gh release download -p "nvd-database.tar.gz" -O /tmp/nvd.tar.gz --repo "${{ github.repository }}" 2>/dev/null || \
          echo "No cached NVD database found, will download fresh"

          if [ -f /tmp/nvd.tar.gz ]; then
            tar xzf /tmp/nvd.tar.gz -C ~/.dependency-check
            echo "✅ Restored NVD database from cache"
          fi

      - name: Download OWASP Dependency-Check (latest)
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/jeremylong/DependencyCheck/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "Downloading Dependency-Check v${LATEST_VERSION}"
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v${LATEST_VERSION}/dependency-check-${LATEST_VERSION}-release.zip
          unzip -q dependency-check-${LATEST_VERSION}-release.zip
          rm dependency-check-${LATEST_VERSION}-release.zip

      - name: Run Dependency-Check on fork
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ ! -f fork/app/pom.xml ]; then
            echo "❌ pom.xml not found in fork/app"
            exit 1
          fi
          mkdir -p ~/.dependency-check/data

          # Use --noupdate if cache exists, otherwise update
          NOUPDATE_FLAG=""
          if [ -d ~/.dependency-check/data ] && [ "$(ls -A ~/.dependency-check/data)" ]; then
            NOUPDATE_FLAG="--noupdate"
            echo "Using cached NVD database"
          else
            echo "Downloading fresh NVD database"
          fi

          ./dependency-check/bin/dependency-check.sh \
            --project "verademo-java-fork" \
            --scan fork/app \
            --scan ~/.m2/repository \
            --out fork-report \
            --format JSON \
            --failOnCVSS 7 \
            --data ~/.dependency-check/data \
            --disableOssIndex \
            $NOUPDATE_FLAG \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"} || true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: fork-report/dependency-check-report.json
          retention-days: 30

      - name: Parse current vulnerabilities
        id: current
        run: |
          python3 << 'EOF'
          import json

          try:
              with open('fork-report/dependency-check-report.json', 'r') as f:
                  report = json.load(f)
          except Exception as e:
              print(f"Error reading report: {e}")
              import os
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("count=0\n")
              exit()

          # Handle different dependency-check JSON structures
          if isinstance(report, dict):
              # Try reportSchema first
              if 'reportSchema' in report and isinstance(report['reportSchema'], dict):
                  dependencies = report['reportSchema'].get('dependencies', [])
              # If not, try top-level dependencies
              elif 'dependencies' in report:
                  dependencies = report['dependencies']
              else:
                  print(f"Debug: report keys = {list(report.keys())}")
                  dependencies = []
          else:
              print(f"Error: report is not a dict, it's {type(report)}")
              dependencies = []

          count = 0

          for dep in dependencies:
              if not isinstance(dep, dict):
                  continue
              vulns = dep.get('vulnerabilities', [])
              for vuln in vulns:
                  if not isinstance(vuln, dict):
                      continue
                  # Count vulnerabilities with CVSS v3 score >= 7.0
                  cvssv3 = vuln.get('cvssv3', {})
                  if isinstance(cvssv3, dict):
                      score = cvssv3.get('baseScore')
                      if score is not None and float(score) >= 7.0:
                          count += 1

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={count}\n")
          print(f"Current: {count} vulnerabilities (CVSS >= 7.0)")
          EOF

      - name: Calculate score
        id: score
        run: |
          baseline=${{ steps.baseline.outputs.count }}
          current=${{ steps.current.outputs.count }}
          score=$((baseline - current))
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "📈 Score: $score vulnerabilities fixed"

      - name: Get current timestamp
        id: timestamp
        run: |
          ts=$(date -u +'%Y-%m-%dT%H:%M:%S.%N' | sed 's/[0-9]\{6\}Z$/Z/')Z
          echo "ts=$ts" >> $GITHUB_OUTPUT

      - name: Debug - Check token availability
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          if [ -z "$LEADERBOARD_TOKEN" ]; then
            echo "❌ LEADERBOARD_TOKEN is empty or not set"
            exit 1
          else
            TOKEN_LENGTH=${#LEADERBOARD_TOKEN}
            echo "✅ LEADERBOARD_TOKEN is available (length: $TOKEN_LENGTH chars)"
            echo "First 10 chars: ${LEADERBOARD_TOKEN:0:10}..."
          fi

      - name: Push to leaderboard
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          cd original
          python3 scripts/score-and-leaderboard.py \
            --repo-name verademo-java \
            --username "${{ github.event.pull_request.user.login }}" \
            --baseline-count ${{ steps.baseline.outputs.count }} \
            --current-count ${{ steps.current.outputs.count }} \
            --timestamp "${{ steps.timestamp.outputs.ts }}" \
            --leaderboard-repo veracode-wad26/leaderboard \
            --github-token "$LEADERBOARD_TOKEN"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const baseline = ${{ steps.baseline.outputs.count }};
            const current = ${{ steps.current.outputs.count }};
            const score = ${{ steps.score.outputs.score }};
            const timestamp = "${{ steps.timestamp.outputs.ts }}";

            let status = '❌';
            if (current === 0) status = '✅';
            else if (score > 0) status = '🟡';

            let body = status + ' **Scoring Update**\n\n';
            body += '| Metric | Value |\n';
            body += '|--------|-------|\n';
            body += '| Baseline | ' + baseline + ' vulnerabilities |\n';
            body += '| Current | ' + current + ' vulnerabilities |\n';
            body += '| Fixed | ' + score + ' vulnerabilities |\n';
            body += '| Timestamp | ' + timestamp + ' |\n\n';
            body += 'Run `mvn dependency-check:check -DfailBuildOnCVSS=7` locally to see details.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail check if vulnerabilities remain
        if: ${{ steps.current.outputs.count > 0 }}
        run: |
          echo "❌ PR still has ${{ steps.current.outputs.count }} vulnerabilities remaining"
          exit 1
